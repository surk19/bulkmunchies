name: Create Uncle Chipps replacement draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/create-uncle-replacement.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: faire-uncle-chipps-draft
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FAIRE_ACCESS_TOKEN: ${{ secrets.FAIRE_ACCESS_TOKEN }}
        with:
          script: |
            const token = (process.env.FAIRE_ACCESS_TOKEN || '').trim();
            const payload = {
              name: 'Uncle Chipps Plain Salted Potato Chips 48g x 12',
              description: 'Enjoy the classic crunch of Uncle Chipps Plain Salted Potato Chips.\nEach bite delivers savory potato flavor with a simple salted finish.\nEnjoy them straight from the bag or alongside sandwiches and your favorite drinks.\nA familiar snack for lunch breaks, gatherings, or everyday cravings.\n\nCountry of origin: India',
              lifecycle_state: 'DRAFT',
              idempotence_token: 'bm-uncle-48g-replacement-20261121-v2',
              unit_multiplier: 12,
              minimum_order_quantity: 12,
              made_in_country: 'IND',
              allow_sales_when_out_of_stock: false,
              images: [{url: 'https://st.perplexity.ai/estatic/0b226c450798410ac541646c86ec31afd840e5beab817a5d84fa821e7db61981ec84c3b4a3f072a7a2e1899c9fb06c6e15d832ab90fe310677ef602edfb0948a0d046dda7cfbc6ef9e258916315045e16d11260b1dd164ea7de7bdc4e01a808f3c8781b842272853e206a38d4d2a9296', sequence: 0}],
              variants: [{
                name: 'Default',
                idempotence_token: 'bm-uncle-48g-replacement-option-v2',
                available_quantity: 600,
                measurements: {weight: 48, mass_unit: 'GRAMS', length: 6.5, width: 27.2, height: 20, distance_unit: 'CENTIMETERS'},
                prices: [{geo_constraint: {country: 'USA'}, wholesale_price: {amount_minor: 189, currency: 'USD'}, retail_price: {amount_minor: 349, currency: 'USD'}}]
              }]
            };
            let report;
            try {
              if (!token) throw new Error('Missing Faire secret');
              const response = await fetch('https://www.faire.com/external-api/v2/products', {method: 'POST', headers: {'X-FAIRE-ACCESS-TOKEN': token, Accept: 'application/json', 'Content-Type': 'application/json'}, body: JSON.stringify(payload), signal: AbortSignal.timeout(60000)});
              const text = await response.text();
              let data;
              try {data = JSON.parse(text);} catch {data = {note: 'Non-JSON response; do not retry blindly'};}
              const scrubbed = JSON.stringify(data).split(token).join('[REDACTED]');
              report = 'CREATE HTTP ' + response.status + '\nCreation response captured before any follow-up lookup.\n```json\n' + scrubbed.slice(0, 40000) + '\n```\nIntended measurements: 48 g net contents; approximate L/W/H 6.5/27.2/20 cm. Verify returned units before relying on saved measurements.\nImage source page: https://spicelands.de/produkt/uncle-chipps-plain-salted-48g/\nNo follow-up writes. No website edits.';
              if (!response.ok) core.setFailed('Faire rejected replacement draft; see captured response');
            } catch (error) {
              report = 'Creation outcome unconfirmed: ' + String(error.message).split(token || 'NO_SECRET').join('[REDACTED]') + '\nDo not retry creation until checked.';
              core.setFailed('Creation outcome unconfirmed');
            }
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: 'Uncle Chipps replacement draft: run ' + context.runId, body: report + '\nCommit: ' + context.sha});

name: Export Faire products
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export products
        env:
          FAIRE_ACCESS_TOKEN: ${{ secrets.FAIRE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          token = os.environ['FAIRE_ACCESS_TOKEN'].strip()
          def get(path):
              req = urllib.request.Request('https://www.faire.com/external-api/v2/' + path, headers={'X-FAIRE-ACCESS-TOKEN': token, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          allp, cursor, pages = [], None, 0
          while True:
              q = 'products' + ('?cursor=' + urllib.parse.quote(cursor) if cursor else '')
              d = get(q); pages += 1
              allp += d.get('products', [])
              cursor = d.get('cursor')
              print('page', pages, 'got', len(d.get('products', [])), 'keys', list(d.keys()))
              if not cursor or pages > 40 or not d.get('products'): break
          os.makedirs('out', exist_ok=True)
          json.dump(allp, open('out/products.json', 'w'), indent=1)
          print('total', len(allp))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: faire-products
          path: out/products.json
          retention-days: 1

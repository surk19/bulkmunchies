name: Test Uncle Chipps Faire draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-faire-draft.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: faire-uncle-chipps-draft
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FAIRE_ACCESS_TOKEN: ${{ secrets.FAIRE_ACCESS_TOKEN }}
        with:
          script: |
            const token = (process.env.FAIRE_ACCESS_TOKEN || '').trim();
            const base = 'https://www.faire.com/external-api/v2';
            const payload = {
              name: 'Uncle Chipps Plain Salted Potato Chips 48g',
              description: 'Enjoy the classic crunch of Uncle Chipps Plain Salted Potato Chips. These potato chips deliver a simple, savory salted flavor, ideal for snacking or pairing with your favorite drink. Each bag contains 48 g. Sold in cases of 12 bags.',
              lifecycle_state: 'DRAFT',
              idempotence_token: 'bm-uncle-chipps-plain-salted-48g-draft-v1',
              unit_multiplier: 12,
              minimum_order_quantity: 12,
              variants: [{name: 'Default', idempotence_token: 'bm-uncle-chipps-48g-default-v1', prices: [{geo_constraint: {country: 'USA'}, wholesale_price: {amount_minor: 189, currency: 'USD'}}]}]
            };
            async function api(path, body) {
              const response = await fetch(base + path, {method: body ? 'POST' : 'GET', headers: {'X-FAIRE-ACCESS-TOKEN': token, 'Accept': 'application/json', 'Content-Type': 'application/json'}, ...(body ? {body: JSON.stringify(body)} : {}), signal: AbortSignal.timeout(45000)});
              if (!response.ok) {
                let detail = '';
                try {
                  const error = await response.json();
                  detail = JSON.stringify({code: error.code, message: error.message, errors: error.errors}).split(token).join('[REDACTED]').replace(/[A-Za-z0-9_+/=-]{24,}/g, '[REDACTED]').slice(0, 1000);
                } catch {}
                throw new Error('Faire HTTP ' + response.status + ' ' + detail);
              }
              return await response.json();
            }
            let report;
            try {
              if (!token) throw new Error('Missing Faire secret');
              let path = '/products', complete = false;
              const seen = new Set();
              for (let n = 0; n < 100; n++) {
                const data = await api(path);
                if (!Array.isArray(data.products)) throw new Error('Unexpected catalog format');
                const matches = data.products.filter(p => /uncle/i.test(p.name || '') && /chip/i.test(p.name || ''));
                if (matches.length) throw new Error('Upload stopped: existing Uncle Chipps product(s): ' + matches.map(p => p.id).join(', '));
                const signature = data.products.map(p => p.id).join(',');
                if (data.products.length && seen.has(signature)) throw new Error('Pagination repeated; no upload attempted');
                seen.add(signature);
                if (data.cursor) path = '/products?cursor=' + encodeURIComponent(data.cursor);
                else if (data.products.length < (data.limit || 50)) {complete = true; break;}
                else if (Number.isInteger(data.page)) path = '/products?page=' + (data.page + 1);
                else throw new Error('Cannot verify complete catalog; no upload attempted');
              }
              if (!complete) throw new Error('Catalog pagination limit reached; no upload attempted');
              const created = await api('/products', payload);
              if (!created.id) throw new Error('Create response lacked product ID; do not retry blindly');
              const verified = await api('/products/' + encodeURIComponent(created.id));
              if (verified.lifecycle_state !== 'DRAFT') throw new Error('Unexpected product state for ' + created.id + ': ' + verified.lifecycle_state);
              report = 'PASS: Created and verified DRAFT ' + created.id + '\nName: ' + verified.name + '\nRequested wholesale: $1.89 per bag; case/minimum: 12 bags.\nPhoto and MSRP omitted.\nVerified product response:\n```json\n' + JSON.stringify({id: verified.id, lifecycle_state: verified.lifecycle_state, unit_multiplier: verified.unit_multiplier, minimum_order_quantity: verified.minimum_order_quantity, variants: (verified.variants || []).map(v => ({id: v.id, prices: v.prices, wholesale_price_cents: v.wholesale_price_cents}))}, null, 2) + '\n```';
            } catch (error) {
              report = 'STOPPED: ' + String(error.message).split(token || 'NO_SECRET').join('[REDACTED]');
              core.setFailed('Draft test stopped; see issue report');
            }
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: 'Uncle Chipps draft test: run ' + context.runId, body: report + '\n\nCommit: ' + context.sha + '\nNo website files changed. No existing Faire products edited.'});

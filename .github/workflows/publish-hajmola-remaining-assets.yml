name: Publish supplied Maha and Regular front JPEGs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hajmola-remaining-assets.yml','assets/products/hajmola-maha-front.avif.base64','assets/products/hajmola-regular-front.avif.base64']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/hajmola-image-tools" sharp
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),sharp=require(process.env.RUNNER_TEMP+'/hajmola-image-tools/node_modules/sharp');
            const rows=[['maha','624c189291cad9f48bb0953da919b85c8735acccf440bc1c48d56aa813814121'],['regular','17e14769919ef0ad70e863f7f78cab468b0a5490cd0ba0c3358f8d57ae6ff52f']];
            const outputs=[];
            for(const [name,expected]of rows){
              const input=Buffer.from(fs.readFileSync('assets/products/hajmola-'+name+'-front.avif.base64','utf8').trim(),'base64');
              if(crypto.createHash('sha256').update(input).digest('hex')!==expected)throw new Error(name+' source checksum mismatch; no JPEG writes');
              const jpeg=await sharp(input).jpeg({quality:95}).toBuffer();const meta=await sharp(jpeg).metadata();if(meta.width!==500||meta.height!==500)throw new Error(name+' dimensions mismatch; no JPEG writes');
              outputs.push({name,jpeg});
            }
            for(const {name,jpeg}of outputs){
              const path='assets/products/hajmola-'+name+'-front.jpg';let sha;
              try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});sha=current.data.sha;if(current.data.encoding==='base64'&&Buffer.from(current.data.content,'base64').equals(jpeg)){core.notice(name+' JPEG already matches');continue;}}catch(e){if(e.status!==404)throw e;}
              const result=await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:'Publish supplied '+name+' front JPEG asset only',content:jpeg.toString('base64'),...(sha?{sha}:{})});
              const url='https://raw.githubusercontent.com/'+context.repo.owner+'/'+context.repo.repo+'/'+result.data.commit.sha+'/'+path;
              core.summary.addHeading(name+' front JPEG').addRaw(url).addBreak().addRaw('500 x 500; SHA256 '+crypto.createHash('sha256').update(jpeg).digest('hex')).addBreak();
            }
            await core.summary.addRaw('Image assets only. No website HTML, catalog data, Imli or Faire changes.').write();

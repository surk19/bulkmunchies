name: Publish verified Imli JPEG asset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hajmola-imli-asset.yml','assets/products/hajmola-imli-front.avif.base64']
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false --prefix "$RUNNER_TEMP/hajmola-image-tools" sharp
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),sharp=require(process.env.RUNNER_TEMP+'/hajmola-image-tools/node_modules/sharp');
            const input=Buffer.from(fs.readFileSync('assets/products/hajmola-imli-front.avif.base64','utf8').trim(),'base64');
            if(crypto.createHash('sha256').update(input).digest('hex')!=='18fdf3265b46a11706994e361b8652164fe0cca1c12102ae0fbc50b21f3a961c')throw new Error('Image checksum mismatch; stopped');
            const jpeg=await sharp(input).jpeg({quality:95}).toBuffer();const m=await sharp(jpeg).metadata();if(m.width!==500||m.height!==500)throw new Error('Unexpected image dimensions');
            const path='assets/products/hajmola-imli-front.jpg';
            let sha;try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});sha=current.data.sha;if(current.data.encoding==='base64'&&Buffer.from(current.data.content,'base64').equals(jpeg)){core.notice('Existing JPEG already matches verified photo');return;}}catch(e){if(e.status!==404)throw e;}
            const result=await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',message:'Publish verified Imli front JPEG asset only',content:jpeg.toString('base64'),...(sha?{sha}:{})});
            const url='https://raw.githubusercontent.com/'+context.repo.owner+'/'+context.repo.repo+'/'+result.data.commit.sha+'/'+path;
            await core.summary.addHeading('Verified Imli JPEG asset').addRaw(url).addBreak().addRaw('500 x 500; SHA256 '+crypto.createHash('sha256').update(jpeg).digest('hex')+'. No website HTML, catalog data, or Faire changes.').write();

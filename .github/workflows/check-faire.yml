name: Check Faire connection
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/check-faire.yml']
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test Faire access
        id: faire
        env:
          FAIRE_ACCESS_TOKEN: ${{ secrets.FAIRE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('FAIRE_ACCESS_TOKEN', '').strip()
          status = 'FAIL: FAIRE_ACCESS_TOKEN is missing or empty'
          if token:
              req = urllib.request.Request('https://www.faire.com/external-api/v2/products?limit=1&page=1', headers={'X-FAIRE-ACCESS-TOKEN': token, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = json.load(response)
                  status = 'PASS: Faire product API accepted the key' if isinstance(data, dict) and isinstance(data.get('products'), list) else 'FAIL: Unexpected response format'
              except urllib.error.HTTPError as error:
                  status = f'FAIL: Faire API HTTP {error.code}'
              except Exception:
                  status = 'FAIL: Connection or response could not be processed'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('result=' + status + '\n')
          print(status)
          PY
      - name: Publish safe result for connector
        if: always()
        uses: actions/github-script@v7
        env:
          FAIRE_RESULT: ${{ steps.faire.outputs.result }}
        with:
          script: |
            const result = process.env.FAIRE_RESULT || 'FAIL: Test did not produce a result';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Faire connection check: run ' + context.runId,
              body: result + '\n\nCommit: ' + context.sha + '\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\nNo website files changed. No API key or product data included.'
            });
      - name: Fail job if connection failed
        if: always()
        env:
          FAIRE_RESULT: ${{ steps.faire.outputs.result }}
        run: |
          case "$FAIRE_RESULT" in
            PASS:*) exit 0 ;;
            *) exit 1 ;;
          esac

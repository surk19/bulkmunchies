name: Check Faire connection
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/check-faire.yml']
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Faire and report safely
        env:
          FAIRE_ACCESS_TOKEN: ${{ secrets.FAIRE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          token = os.environ.get('FAIRE_ACCESS_TOKEN', '').strip()
          results, passed = [], False
          def safe(value):
              text = str(value).replace(token, '[REDACTED]') if token else str(value)
              return re.sub(r'[A-Za-z0-9_+/=-]{24,}', '[REDACTED]', text)[:800]
          if not token:
              results.append('FAIL: Missing FAIRE_ACCESS_TOKEN')
          else:
              for query in ['', '?limit=50', '?limit=250&page=1']:
                  req = urllib.request.Request('https://www.faire.com/external-api/v2/products' + query, headers={'X-FAIRE-ACCESS-TOKEN': token, 'Accept': 'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = json.load(response)
                      if isinstance(data, dict) and isinstance(data.get('products'), list):
                          results.append('PASS: products' + query + '; returned products: ' + str(len(data['products'])))
                          passed = True
                          break
                      results.append('FAIL: Unexpected response format')
                  except urllib.error.HTTPError as error:
                      detail = 'No structured error message'
                      try:
                          payload = json.loads(error.read(8192))
                          if isinstance(payload, dict):
                              detail = '; '.join(str(payload[k]) for k in ['code', 'error_code', 'message', 'error', 'errors'] if k in payload)
                      except Exception:
                          pass
                      results.append('FAIL: products' + query + '; HTTP ' + str(error.code) + '; ' + safe(detail))
                  except Exception:
                      results.append('FAIL: Connection or response processing error')
          report = '\n'.join(results)
          body = report + '\n\nCommit: ' + os.environ['GITHUB_SHA'] + '\nNo website files changed. API key redacted; product contents omitted.'
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues', data=json.dumps({'title': 'Faire diagnostic: run ' + os.environ['GITHUB_RUN_ID'], 'body': body}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=45) as response:
              response.read()
          print(report)
          sys.exit(0 if passed else 1)
          PY

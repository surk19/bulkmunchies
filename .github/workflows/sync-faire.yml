name: Sync products from Faire
on:
  # Schedule turns on once Faire pricing is confirmed:
  # schedule:
  #   - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-faire
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'surk19/bulkmunchies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull products from Faire
        env:
          FAIRE_ACCESS_TOKEN: ${{ secrets.FAIRE_ACCESS_TOKEN }}
        run: python3 scripts/sync_faire.py
      - name: Publish if anything changed
        run: |
          if git diff --quiet index.html; then echo "Nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync products from Faire"
          git push
